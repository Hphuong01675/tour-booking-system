name: Katalon Test Automation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  katalon-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Katalon project
        run: |
          ls -la
          ls -la Tour_booking_Chip3chip_system
          test -f "$PWD/Tour_booking_Chip3chip_system/Tour_booking_Chip3chip_system.prj"
          test -f "$PWD/Tour_booking_Chip3chip_system/Data Files/Data_DangKy.xlsx"
          grep -n "Data_DangKy.xlsx\\|ExcelFile\\|Data_DangKy" "$PWD/Tour_booking_Chip3chip_system/Data Files/Data_Dangky.dat"

      - name: Start frontend app
        run: |
          node --version
          npm --version
          cd frontend
          npm ci
          npm run build
          npm run dev -- --host 0.0.0.0 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5173/register > /dev/null; then
              echo "Frontend is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Frontend did not start in time"
          cat /tmp/frontend.log
          exit 1

      - name: Disable Katalon AI self-healing in CI
        run: |
          SELFHEAL_FILE="Tour_booking_Chip3chip_system/settings/internal/selfheal.webui.properties"
          EXEC_FILE="Tour_booking_Chip3chip_system/settings/internal/com.kms.katalon.execution.properties"

          if [ -f "$SELFHEAL_FILE" ]; then
            sed -i 's@^ai.enabled=.*@ai.enabled=false@' "$SELFHEAL_FILE"
            sed -i 's@^ai.inputSources=.*@ai.inputSources=[]@' "$SELFHEAL_FILE"
            sed -i 's@^execution.default.webUi.selfHealingEnabled=.*@execution.default.webUi.selfHealingEnabled=false@' "$SELFHEAL_FILE"
            sed -i 's@^execution.default.webUi.methodsPriorityOrderNew=.*@execution.default.webUi.methodsPriorityOrderNew=XPATH,true;SMART_LOCATOR,false;BASIC,true;CSS,true;IMAGE,false@' "$SELFHEAL_FILE"
          fi

          if [ -f "$EXEC_FILE" ]; then
            grep -q '^execution.default.webUi.selfHealingEnabled=' "$EXEC_FILE" \
              && sed -i 's@^execution.default.webUi.selfHealingEnabled=.*@execution.default.webUi.selfHealingEnabled=false@' "$EXEC_FILE" \
              || echo 'execution.default.webUi.selfHealingEnabled=false' >> "$EXEC_FILE"
          fi

      - name: Run Katalon Tests
        env:
          KATALON_API_KEY: ${{ secrets.KATALON_API_KEY }}
        run: |
          PROJECT_FILE="$PWD/Tour_booking_Chip3chip_system/Tour_booking_Chip3chip_system.prj"
          echo "Using Katalon project: $PROJECT_FILE"
          docker run --rm --network host \
            -v "$PWD:$PWD" \
            -w "$PWD" \
            -e KATALON_API_KEY="$KATALON_API_KEY" \
            -e JAVA_TOOL_OPTIONS="-Djava.awt.headless=true" \
            katalonstudio/katalon:11.2.1 \
            katalonc -noSplash -runMode=console \
            -projectPath="$PROJECT_FILE" \
            -testSuitePath="Test Suites/Dangky" \
            -executionProfile=default \
            -apiKey="$KATALON_API_KEY" \
            -browserType="Chrome (headless)" \
            --config \
            -webui.autoUpdateDrivers=true \
            -execution.default.webUi.selfHealingEnabled=false \
            -execution.default.webUi.methodsPriorityOrderNew="XPATH,true;SMART_LOCATOR,false;BASIC,true;CSS,true;IMAGE,false" \
            -report.videoRecorderOption="{\"enable\":false,\"useBrowserRecorder\":false,\"recordAllTestCases\":false,\"allowedRecordIfFailed\":false,\"allowedRecordIfPassed\":false}" \
            -report.videoRecorderSettings="{\"enable\":false,\"useBrowserRecorder\":false,\"recordAllTestCases\":false}"

      - name: Fix Katalon report permissions
        if: always()
        run: |
          if [ -d "Tour_booking_Chip3chip_system/Reports" ]; then
            sudo chown -R "$USER:$USER" Tour_booking_Chip3chip_system/Reports
            chmod -R u+rwX,go+rX Tour_booking_Chip3chip_system/Reports
          fi

      - name: Upload Katalon Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katalon-reports
          path: Tour_booking_Chip3chip_system/Reports/**
          if-no-files-found: ignore
