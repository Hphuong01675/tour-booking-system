name: Katalon Test Automation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  katalon-test:
    runs-on: ubuntu-latest
    container:
      image: katalonstudio/katalon:11.2.1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Katalon project
        run: |
          ls -la
          ls -la Tour_booking_Chip3chip_system
          test -f "$PWD/Tour_booking_Chip3chip_system/Tour_booking_Chip3chip_system.prj"
          test -f "$PWD/Tour_booking_Chip3chip_system/Data Files/Data_DangKy.xlsx"
          grep -n "Data_DangKy.xlsx\\|ExcelFile\\|Data_DangKy" "$PWD/Tour_booking_Chip3chip_system/Data Files/Data_Dangky.dat"

      - name: Start frontend app
        run: |
          node --version
          npm --version
          cd frontend
          npm ci
          npm run dev -- --host 0.0.0.0 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5173/register > /dev/null; then
              echo "Frontend is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Frontend did not start in time"
          cat /tmp/frontend.log
          exit 1

      - name: Run Katalon Tests
        env:
          KATALON_API_KEY: ${{ secrets.KATALON_API_KEY }}
        run: |
          PROJECT_FILE="$PWD/Tour_booking_Chip3chip_system/Tour_booking_Chip3chip_system.prj"
          echo "Using Katalon project: $PROJECT_FILE"
          katalonc -noSplash -runMode=console \
            -projectPath="$PROJECT_FILE" \
            -testSuitePath="Test Suites/Dangky" \
            -executionProfile=default \
            -apiKey="$KATALON_API_KEY" \
            -browserType="Chrome (headless)" \
            --config \
            -webui.autoUpdateDrivers=true \
            -report.videoRecorderOption="{\"enable\":false,\"useBrowserRecorder\":false,\"recordAllTestCases\":false,\"allowedRecordIfFailed\":false,\"allowedRecordIfPassed\":false}" \
            -report.videoRecorderSettings="{\"enable\":false,\"useBrowserRecorder\":false,\"recordAllTestCases\":false}"

      - name: Upload Katalon Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katalon-reports
          path: Tour_booking_Chip3chip_system/Reports/**
          if-no-files-found: ignore
